  start_height: 11474360
  token_contract: "0x27702a26126e0B3702af63Ee09aC4d1A084EF628"
  token_start_height: 10939074


postgres:
  host: postgres
  # The PostgreSQL password defaults to a built-in value; set the POSTGRES_PASSWORD
  # environment variable (or a `password:` key here). The variable overrides the file.
  # Or read it from a file (e.g. a mounted secret), re-read for each new connection;
  # it wins over both. Also settable with POSTGRES_PASSWORD_FILE.
  # password_file: /run/secrets/postgres-password
  # Seconds to establish a connection (TCP, TLS, auth); 0 = no limit.
  # connect_timeout_s: 10
  # TLS mode: disable, allow, prefer, require, verify-ca or verify-full.
  # Unset = PGSSLMODE or libpq's default (prefer).
  # sslmode: require
  # TCP keepalives (psycopg2 connections only); 0 = keep the OS default.
  # keepalives_idle_s: 60
  # keepalives_interval_s: 10
  # keepalives_count: 5


storage:
  store_files: true
  # "filesystem" keeps files in `folder`; "s3" keeps them in an S3-compatible
  # bucket (Garage, MinIO, AWS S3) configured in the `s3` block below.
  engine: filesystem
  folder: /var/lib/pyaleph
  removal_grace_period_hours: 25
  # To use S3: `prefix` is prepended as is to each key ("node-1/" gives
  # "node-1/<hash>"). access_key_id is also settable with
  # STORAGE_S3_ACCESS_KEY_ID; the secret with STORAGE_S3_SECRET_ACCESS_KEY or
  # secret_access_key_file (read once at startup, wins; also
  # STORAGE_S3_SECRET_ACCESS_KEY_FILE). ca_bundle is a PEM bundle for a private
  # CA; unset = system store or AWS_CA_BUNDLE.
  # s3:
  #   endpoint_url: https://s3.garage.svc
  #   region: garage
  #   bucket: aleph-files
  #   prefix: ""
  #   access_key_id: GK0123456789abcdef
  #   secret_access_key_file: /run/secrets/s3-secret-access-key
  #   ca_bundle: /etc/ssl/certs/garage-ca.pem


ipfs:
  enabled: true
  host: ipfs
  port: 5001
  gateway_port: 8080


aleph:
  queue_topic: ALEPH-TEST


p2p:
  daemon_host: p2p-service
  http_port: 4024
  port: 4025
  control_port: 4030
  listen_port: 4031
  reconnect_delay: 60
  peers:
    - /dns/api2.aleph.im/tcp/4025/p2p/QmZkurbY2G2hWay59yiTgQNaQxHSNzKZFt2jbnwJhQcKgV
    - /dns/api3.aleph.im/tcp/4025/p2p/Qmb5b2ZwJm9pVWrppf3D3iMF1bXbjZhbJTwGvKEBMZNxa2


rabbitmq:
  host: rabbitmq
  port: 5672
  username: aleph-p2p
  # The RABBITMQ_PASSWORD environment variable, when set, overrides this value.
  password: change-me!
  # Or read it from a file, which wins over both (also RABBITMQ_PASSWORD_FILE).
  # Read when the node connects: rotating the RabbitMQ password takes a restart.
  # password_file: /run/secrets/rabbitmq-password


sentry:
  dsn: ""
